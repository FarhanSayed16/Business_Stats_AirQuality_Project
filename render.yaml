services:
  - type: web
    name: airwatch-co-api
    runtime: python
    buildCommand: "pip install -r requirements.txt -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://business-stats-air-quality-project.vercel.app"
